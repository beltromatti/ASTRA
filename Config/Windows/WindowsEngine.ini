; ASTRA on Windows (docs/WINDOWS.md): the twin of Config/Mac/MacEngine.ini. It repeats the Mac's values that the game's code relies on (the
; dynamic resolution that the SETTINGS page drives: without OperationMode=2 its IMAGE and FRAME RATE rows would change nothing) and those that
; change the picture, so that the first game on a PC looks like the Mac's. It does not repeat what is memory on the Mac (r.Streaming.PoolSize,
; r.ShaderCompiler.MemoryLimit, PoolSizeVRAMPercentage=0: a PC has its own VRAM and the engine uses 70 % of it), nor MetalFX (the AstraMetalFX
; plugin exists on the Mac only: on Windows the picture goes through TSR, r.AntiAliasingMethod=4 in DefaultEngine.ini).
; Every number was measured on the MacBook Air M4: TO BE TUNED on the first PC (docs/WINDOWS.md, "Dopo la prima partita").
[SystemSettings]
; the dynamic resolution keeps the frame inside its time (60 fps), always on; 40 % is the floor the SETTINGS page raises or lowers
r.DynamicRes.OperationMode=2
r.DynamicRes.FrameTimeBudget=16.67
r.DynamicRes.MinScreenPercentage=40
r.DynamicRes.MaxScreenPercentage=100
; TSR keeps its history at the output resolution (Epic's level keeps it at 200 %), glass takes its reflections from the scene's captures, the
; unshadowed local lights are shaded in one clustered pass
r.TSR.History.ScreenPercentage=100
r.Lumen.TranslucencyReflections.RadianceCache=0
r.UseClusteredDeferredShading_ToBeRemoved=1
; the sun's shadow without the LOD bias the eye cannot see, a touch of sharpening after TSR, the main viewscreen's camera at 20 Hz
r.Shadow.Virtual.ResolutionLodBiasDirectional=0
r.Tonemapper.Sharpen=0.6
astra.viewscreen.hz=20
; Lumen traces only the reflections of smooth surfaces, the sun's soft shadow filter at 4 rays of 2 samples
r.Lumen.Reflections.MaxRoughnessToTrace=0.25
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=2

; A game that is not high-DPI aware has its window drawn at the logical resolution and stretched by Windows (on a display scaled to 150 % the
; picture is a little soft, and cheaper): the engine's default, kept. For the display's real pixels: bAllowHighDPIInGameMode=True (and, in the
; SETTINGS page, a row for a half-resolution output like the Mac's RETINA). A decision to take looking at a 4K laptop.
[/Script/Engine.UserInterfaceSettings]
bAllowHighDPIInGameMode=False
