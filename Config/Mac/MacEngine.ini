; ASTRA: memoria per MacBook Air M4 16 GB (docs/ricerca/11)
[TextureStreaming]
PoolSizeVRAMPercentage=0

[SystemSettings]
r.Streaming.PoolSize=2000
r.ShaderCompiler.MemoryLimit=3072
; the game on a Retina Mac (the app is high-DPI): the UI is drawn at the display's own resolution; the 3D view goes
; through TSR at half of it (the engine's default secondary fraction on a 2x display), and dynamic resolution keeps the
; GPU inside a 60 fps budget (a fanless MacBook Air throttles under sustained load: the image adapts instead of the
; frame rate)
r.DynamicRes.OperationMode=2
r.DynamicRes.FrameTimeBudget=16.67
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=100
