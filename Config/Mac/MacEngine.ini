; ASTRA: memoria per MacBook Air M4 16 GB (docs/ricerca/11)
[TextureStreaming]
PoolSizeVRAMPercentage=0

[SystemSettings]
r.Streaming.PoolSize=2000
r.ShaderCompiler.MemoryLimit=3072
; the game on a Retina Mac (the app is high-DPI): the UI is drawn at the display's own resolution; the 3D view goes
; through TSR at half of it (the engine's default secondary fraction on a 2x display), and dynamic resolution keeps the
; GPU inside a 60 fps budget (a fanless MacBook Air throttles under sustained load: the image adapts instead of the
; frame rate; the floor, 40%, is reached only when the chip is hot: the bridge runs at 50% with 2 ms to spare)
r.DynamicRes.OperationMode=2
r.DynamicRes.FrameTimeBudget=16.67
r.DynamicRes.MinScreenPercentage=40
r.DynamicRes.MaxScreenPercentage=100
; measured on the bridge (docs/STATO.md, "Prestazioni"): the GPU is the limit, and these three cost nothing visible —
; TSR keeps its history at the output resolution (the Epic level keeps it at 200%: 3420x2214 on a Retina Air, 2.5 ms),
; glass takes its reflections from the scene's captures instead of Lumen's radiance cache (the probe marking pass, 1 ms),
; the unshadowed local lights are shaded in one clustered pass instead of one pass each (0.7 ms)
r.TSR.History.ScreenPercentage=100
r.Lumen.TranslucencyReflections.RadianceCache=0
r.UseClusteredDeferredShading_ToBeRemoved=1
; measured on the v3 bridge in battle at 60% (docs/STATO.md): the sun's virtual shadow map at its default -1.5 LOD bias cost
; 3 ms more than at 0 for shadows the eye does not resolve at this resolution; the main viewscreen's camera at 20 Hz
; (astra.viewscreen.hz) instead of 30 saves 0.7 ms; a touch of sharpening after TSR keeps edges crisp at 50-60%
r.Shadow.Virtual.ResolutionLodBiasDirectional=0
r.Tonemapper.Sharpen=0.6
astra.viewscreen.hz=20
