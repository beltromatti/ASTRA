; ASTRA — default scalability for the reference machine (MacBook Air M4 16 GB), profile "A" (docs/ricerca/11).
; Lumen Lite (GI/reflections quality 1), VSM shadows Q2, TSR at 62% with dynamic resolution headroom.
[ScalabilityGroups]
sg.ResolutionQuality=62
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=1
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
sg.LandscapeQuality=3

; the whole screen (the menu bar hidden), synchronised to the display, 60 fps at most: no work the eye cannot see
[/Script/Engine.GameUserSettings]
bUseVSync=True
bUseDynamicResolution=True
FrameRateLimit=60.000000
FullscreenMode=1
LastConfirmedFullscreenMode=1
PreferredFullscreenMode=1
