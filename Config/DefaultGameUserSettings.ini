; ASTRA — default scalability for the reference machine (MacBook Air M4 16 GB), profile "A" (docs/ricerca/11).
; Lumen Lite (GI/reflections quality 1), VSM shadows Q2, TSR at 62% with dynamic resolution headroom.
[ScalabilityGroups]
sg.ResolutionQuality=62
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=1
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
sg.LandscapeQuality=3

; synchronised to the display, 60 fps at most: no work the eye cannot see. The app starts in a window and goes full
; screen by itself once it is in front (Source/ASTRA/ASTRA.cpp): a window created full screen can hang the start on a Mac
; Version: without it the engine ignores this section when it creates the window (and resets the settings on the first run)
[/Script/Engine.GameUserSettings]
Version=5
bUseVSync=True
bUseDynamicResolution=True
FrameRateLimit=60.000000
FullscreenMode=2
LastConfirmedFullscreenMode=2
PreferredFullscreenMode=1
