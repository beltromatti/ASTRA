[project]
name = "astra-voice"
version = "0.1.0"
description = "ASTRA — servizio voce locale: sintesi (TTS), riconoscimento (STT), labiale"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pocket-tts>=1.0",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astra_voice"]
