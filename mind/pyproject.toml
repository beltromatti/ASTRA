[project]
name = "astra-mind"
version = "0.1.0"
description = "ASTRA — servizio AI: gateway dei modelli, agenti dell'equipaggio, Regista della guerra"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28",
    "pydantic>=2.9",
    "lingua-language-detector>=2.0",
    "websockets>=14",
    "pocket-tts>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "num2words>=0.5.13",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    # speech recognition that runs anywhere (Windows, Linux, an Intel Mac): the engines of the portable path. A Mac with the Neural Engine
    # helper (mind/stt_server, Apple Silicon only) does not carry them; `uv sync --extra portable` adds them there to try that path
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "sherpa-onnx>=1.12; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "sherpa-onnx-core>=1.12; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
# the same engines for any machine, the ones that have the helper too: uv sync --extra portable
portable = ["faster-whisper>=1.1", "sherpa-onnx>=1.12", "sherpa-onnx-core>=1.12"]

[project.scripts]
astra-bench = "astra_mind.bench.run:main"
astra-mind = "astra_mind.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astra_mind"]
