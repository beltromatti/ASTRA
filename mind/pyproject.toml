[project]
name = "astra-mind"
version = "0.1.0"
description = "ASTRA — servizio AI: gateway dei modelli, agenti dell'equipaggio, Regista della guerra"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28",
    "pydantic>=2.9",
    "lingua-language-detector>=2.0",
    "websockets>=14",
    "pocket-tts>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "num2words>=0.5.13",
    "soundfile>=0.12",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
# speech recognition that runs anywhere (Windows, Linux, a Mac without the Neural Engine helper): uv sync --extra portable
portable = ["faster-whisper>=1.1", "sherpa-onnx>=1.12", "sherpa-onnx-core>=1.12"]

[project.scripts]
astra-bench = "astra_mind.bench.run:main"
astra-mind = "astra_mind.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astra_mind"]
